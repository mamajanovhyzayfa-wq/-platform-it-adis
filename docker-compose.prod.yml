# Production-топология: отдельные окружения задаются файлом .env.production
# (см. infrastructure/README.md). Секреты не хранятся в этом файле.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Память под shared_buffers и parallel query: Docker по умолчанию даёт 64 MB shm.
    shm_size: 2gb
    # Рассчитано на 8+ GB RAM и до ~10 активных БД филиалов.
    # При большем числе филиалов уменьшите PGBOUNCER_DEFAULT_POOL_SIZE
    # или поднимите POSTGRES_MAX_CONNECTIONS и память сервера.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-400}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - log_min_duration_statement=500ms
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itadis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-itadis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-itadis} -d ${POSTGRES_DB:-itadis}']
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: '50m', max-file: '7' }

  # PgBouncer принимает соединения всех реплик API и филиалов, а к PostgreSQL
  # открывает небольшой пул. Prisma 6 работает через transaction mode;
  # max_prepared_statements включён, поэтому pgbouncer=true в URL не нужен.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p1
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:-itadis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Wildcard: каждая БД филиала проходит через тот же PgBouncer.
      DB_NAME: '*'
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-20000}
      LISTEN_BACKLOG: ${PGBOUNCER_LISTEN_BACKLOG:-2048}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-30}
      MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-60}
      QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-30}
      ADMIN_USERS: ${POSTGRES_USER:-itadis}
      STATS_USERS: ${POSTGRES_USER:-itadis}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-itadis}']
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-512mb}',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  # Антивирус для uploads. Официальный образ отдаёт только протокол clamd
  # (3310), поэтому рядом работает HTTP-обёртка `antivirus`, которую вызывает
  # backend через ANTIVIRUS_SCAN_URL. Базы сигнатур живут в volume и
  # обновляются freshclam внутри образа.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: 'true'
      # Обновлением занимается freshclam в этом же контейнере при старте.
      CLAMAV_NO_FRESHCLAMD: 'false'
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 5 >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 20
      # Первый старт скачивает базы сигнатур — это минуты, а не секунды.
      start_period: 300s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  antivirus:
    image: node:24-alpine
    restart: unless-stopped
    command: ['node', '/srv/rest.mjs']
    environment:
      PORT: '8080'
      CLAMD_HOST: clamav
      CLAMD_PORT: '3310'
      ANTIVIRUS_API_KEY: ${ANTIVIRUS_API_KEY:-}
    volumes:
      - ./infrastructure/clamav/rest.mjs:/srv/rest.mjs:ro
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [internal]
    logging: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
    logging: *logging

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb -p local/$$S3_BUCKET || true &&
      mc anonymous set none local/$$S3_BUCKET
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-itadis}
    networks: [internal]

  migrate:
    build:
      context: ./apps/api
      target: build
    restart: 'no'
    environment:
      # Миграции идут напрямую в PostgreSQL, не через transaction pooler.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-itadis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-itadis}?schema=public"
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-itadis-backend:latest}
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      antivirus:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Приложение ходит только через PgBouncer.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-itadis}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-itadis}?schema=public&connection_limit=${DATABASE_CONNECTION_LIMIT:-10}&pool_timeout=${DATABASE_POOL_TIMEOUT:-10}"
      # Прямое подключение нужно только pg_dump/pg_restore и провижинингу.
      DIRECT_DATABASE_URL: "postgresql://${POSTGRES_USER:-itadis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-itadis}?schema=public"
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-10}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (32+ random characters)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET (32+ random characters)}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY (32+ random characters)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Строгая изоляция: неизвестный домен не должен открывать основную БД.
      ALLOW_PRIMARY_FALLBACK: ${ALLOW_PRIMARY_FALLBACK:-false}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_PASSWORD_HASH: ${PLATFORM_ADMIN_PASSWORD_HASH:-}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      # Production-валидация env требует внешний антивирусный сканер.
      # По умолчанию — контейнер ClamAV из этого же compose-файла.
      ANTIVIRUS_SCAN_URL: ${ANTIVIRUS_SCAN_URL:-http://antivirus:8080/scan}
      ANTIVIRUS_PROVIDER: ${ANTIVIRUS_PROVIDER:-clamav}
      ANTIVIRUS_API_KEY: ${ANTIVIRUS_API_KEY:-}
      # Записи LiveDigital и вложения не должны исчезать при пересоздании контейнера.
      UPLOADS_DIR: /data/uploads
      LIVEDIGITAL_API_URL: ${LIVEDIGITAL_API_URL:-https://moodhood-api.livedigital.space/v1}
      LIVEDIGITAL_API_TOKEN: ${LIVEDIGITAL_API_TOKEN:-}
      LIVEDIGITAL_SPACE_ID: ${LIVEDIGITAL_SPACE_ID:-}
      LIVEDIGITAL_WEBHOOK_SECRET: ${LIVEDIGITAL_WEBHOOK_SECRET:-}
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /data/backups
      BACKUP_SCHEDULER_ENABLED: 'true'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-itadis}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-IT Adis <no-reply@itadis.local>}"
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      APPLE_CALDAV_URL: ${APPLE_CALDAV_URL:-}
      APPLE_CALDAV_USERNAME: ${APPLE_CALDAV_USERNAME:-}
      APPLE_CALDAV_PASSWORD: ${APPLE_CALDAV_PASSWORD:-}
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      ACCOUNTING_PROVIDER: ${ACCOUNTING_PROVIDER:-generic}
      ACCOUNTING_BASE_URL: ${ACCOUNTING_BASE_URL:-}
      ACCOUNTING_API_KEY: ${ACCOUNTING_API_KEY:-}
      ONLINE_PAYMENTS_PROVIDER: ${ONLINE_PAYMENTS_PROVIDER:-}
      ONLINE_PAYMENTS_MERCHANT_ID: ${ONLINE_PAYMENTS_MERCHANT_ID:-}
      ONLINE_PAYMENTS_API_KEY: ${ONLINE_PAYMENTS_API_KEY:-}
      ONLINE_PAYMENTS_WEBHOOK_SECRET: ${ONLINE_PAYMENTS_WEBHOOK_SECRET:-}
      FREEDOMPAY_MERCHANT_ID: ${FREEDOMPAY_MERCHANT_ID:-}
      FREEDOMPAY_SECRET_KEY: ${FREEDOMPAY_SECRET_KEY:-}
      FREEDOMPAY_BASE_URL: ${FREEDOMPAY_BASE_URL:-https://api.freedompay.kg}
      FREEDOMPAY_TESTING_MODE: ${FREEDOMPAY_TESTING_MODE:-false}
      ELSOM_BASE_URL: ${ELSOM_BASE_URL:-}
      ELSOM_TENANT_ID: ${ELSOM_TENANT_ID:-}
      ELSOM_PARTNER_CODE: ${ELSOM_PARTNER_CODE:-}
      ELSOM_PASSWORD: ${ELSOM_PASSWORD:-}
    volumes:
      - storage_data:/data/storage
      - uploads_data:/data/uploads
      - backup_data:/data/backups
    ulimits:
      # 10 000 WebSocket-соединений на процесс требуют запаса дескрипторов.
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    logging: *logging

  admin:
    image: ${ADMIN_IMAGE:-itadis-admin:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  # Внутренний nginx: наружу не публикуется, его слушает TLS-фронт `caddy`.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  # TLS-фронт без покупки домена: PUBLIC_HOSTNAME вида 203-0-113-10.sslip.io
  # (sslip.io резолвит его в 203.0.113.10). Caddy сам получает и обновляет
  # сертификат Let's Encrypt, проксирует HTTP и WebSocket на `edge`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      edge:
        condition: service_started
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME (e.g. 203-0-113-10.sslip.io)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [internal]
    logging: *logging

  prometheus:
    image: prom/prometheus:latest
    profiles: ['monitoring']
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks: [internal]
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_signatures:
  caddy_data:
  caddy_config:
  storage_data:
  uploads_data:
  backup_data:
  prometheus_data:
