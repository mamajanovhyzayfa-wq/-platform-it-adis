name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itadis
          POSTGRES_PASSWORD: itadis
          POSTGRES_DB: itadis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itadis -d itadis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itadis:itadis@127.0.0.1:5432/itadis?schema=public
      CONTROL_DATABASE_URL: postgresql://itadis:itadis@127.0.0.1:5432/itadis?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-1234
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-5678
      NODE_ENV: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Bootstrap администратора на чистой БД (идемпотентность и логи)
        env:
          NODE_ENV: production
          PLATFORM_ADMIN_EMAIL: bootstrap@example.com
          PLATFORM_ADMIN_PASSWORD: ci-bootstrap-password-0123456789
        run: |
          node dist/src/bootstrap.js | tee /tmp/bootstrap-1.log
          node dist/src/bootstrap.js | tee /tmp/bootstrap-2.log

          grep -q '→ created' /tmp/bootstrap-1.log
          grep -q '→ unchanged' /tmp/bootstrap-2.log

          # Пароль и bcrypt-хеш не должны попадать в вывод контейнера.
          if grep -q 'ci-bootstrap-password-0123456789' /tmp/bootstrap-1.log /tmp/bootstrap-2.log; then
            echo 'Пароль администратора попал в лог bootstrap'
            exit 1
          fi
          if grep -qE '\$2[aby]\$' /tmp/bootstrap-1.log /tmp/bootstrap-2.log; then
            echo 'bcrypt-хеш попал в лог bootstrap'
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client'
          import bcrypt from 'bcryptjs'

          const password = 'ci-bootstrap-password-0123456789'
          const prisma = new PrismaClient()
          try {
            const users = await prisma.user.findMany({ where: { email: 'bootstrap@example.com' } })
            if (users.length !== 1) throw new Error(`ожидался 1 администратор, найдено ${users.length}`)
            const [user] = users
            if (user.role !== 'ADMIN') throw new Error(`роль ${user.role}, ожидалась ADMIN`)
            if (!(await bcrypt.compare(password, user.passwordHash))) {
              throw new Error('пароль не совпадает с сохранённым хешем')
            }
            const role = await prisma.role.findUnique({ where: { code: 'ADMIN' } })
            if (!role) throw new Error('роль ADMIN отсутствует в каталоге ролей')
            const grants = await prisma.rolePermission.count({ where: { role: 'ADMIN' } })
            const permissions = await prisma.permission.count()
            if (grants === 0 || grants !== permissions) {
              throw new Error(`у ADMIN ${grants} прав из ${permissions}`)
            }
            console.log(`Bootstrap: ${user.email}, роль ${user.role}, прав ${grants}/${permissions}`)
          } finally {
            await prisma.$disconnect()
          }
          NODE
      - name: Фактический хеш администратора из БД не попадает в логи
        run: |
          # Грепаем не шаблон \$2[aby]\$, а буквальное значение из таблицы:
          # шаблон совпадает с любым bcrypt-хешем в тексте и даёт ложные
          # срабатывания. Нет хеша в БД — шаг падает, а не молча проходит.
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { PrismaClient } from '@prisma/client'

          const prisma = new PrismaClient()
          try {
            const user = await prisma.user.findUnique({ where: { email: 'bootstrap@example.com' } })
            if (!user?.passwordHash) throw new Error('в БД нет passwordHash администратора')
            if (user.passwordHash.length !== 60) {
              throw new Error(`длина хеша ${user.passwordHash.length}, ожидалось 60`)
            }
            writeFileSync('/tmp/bootstrap-hash.txt', user.passwordHash)
          } finally {
            await prisma.$disconnect()
          }
          NODE
          hash=$(cat /tmp/bootstrap-hash.txt)
          if grep -qF -- "$hash" /tmp/bootstrap-1.log /tmp/bootstrap-2.log; then
            echo 'Фактический bcrypt-хеш из БД попал в лог bootstrap'
            exit 1
          fi
          echo 'Фактического хеша из БД в логах bootstrap нет'
      - run: npm test

  # Bootstrap администратора на реальном PostgreSQL: пять сценариев, каждый —
  # с проверкой состояния таблиц SQL до и после запуска CLI. In-memory двойник
  # из unit-тестов здесь не участвует.
  bootstrap-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itadis
          POSTGRES_PASSWORD: itadis
          POSTGRES_DB: itadis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itadis -d itadis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itadis:itadis@127.0.0.1:5432/itadis?schema=public
      PGPASSWORD: itadis
      # NODE_ENV здесь намеренно не задан: npm ci с NODE_ENV=production
      # пропускает devDependencies, и сборка падает на отсутствующем tsc.
      # Каждый запуск bootstrap сам выставляет NODE_ENV=production.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Клиент psql
        run: |
          # На ubuntu-latest psql обычно уже есть, но шаг не должен падать
          # из-за образа runner-а, где клиент не установлен.
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          }
          psql --version
      - name: Пять сценариев bootstrap с SQL до/после
        run: bash scripts/ci-bootstrap-postgres.sh

  # Полный production-стек в docker compose. Запускаются настоящие PostgreSQL,
  # PgBouncer, Redis, MinIO, ClamAV, migrate, bootstrap, backend, admin и nginx
  # edge; Caddy не поднимается, потому что Let's Encrypt не выдаст сертификат
  # на runner, и edge публикуется напрямую (infrastructure/ci/docker-compose.ci.yml).
  full-stack-e2e:
    runs-on: ubuntu-latest
    # Запас на сборку образов и на первичную загрузку баз ClamAV.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить .env.production для стека
        run: |
          env_file="$RUNNER_TEMP/production.env"
          {
            echo 'POSTGRES_USER=itadis'
            echo 'POSTGRES_DB=itadis'
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo 'PUBLIC_HOSTNAME=primary.local'
            echo 'ACME_EMAIL=ci@example.com'
            # Production-валидация требует https в APP_ORIGIN, а TLS в CI никто не
            # терминирует: smoke идёт в edge по http. Origin — только строка
            # заголовка, CORS сверяет её с APP_ORIGIN, поэтому схемы совпадают.
            echo 'APP_ORIGIN=https://primary.local'
            echo 'ADMIN_WEB_ORIGIN=https://primary.local'
            echo 'API_PUBLIC_URL=https://primary.local'
            echo 'PRIMARY_DOMAIN=primary.local'
            echo 'PLATFORM_DOMAIN=primary.local'
            echo 'ALLOW_PRIMARY_FALLBACK=false'
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "DATA_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo 'S3_ACCESS_KEY=ci-minio-access-key'
            echo 'S3_SECRET_KEY=ci-minio-secret-key-0123456789abcdef'
            echo 'S3_BUCKET=itadis'
            echo 'PLATFORM_ADMIN_EMAIL=platform@example.com'
            echo 'PLATFORM_ADMIN_PASSWORD=ci-platform-admin-password-0123'
          } >"$env_file"
          echo "COMPOSE_ENV=$env_file" >>"$GITHUB_ENV"
      - name: Домен основного филиала на localhost
        run: echo '127.0.0.1 primary.local' | sudo tee -a /etc/hosts
      - name: Собрать и поднять стек
        run: |
          docker compose --env-file "$COMPOSE_ENV" \
            -f docker-compose.prod.yml \
            -f infrastructure/ci/docker-compose.ci.yml \
            up -d --build \
            postgres pgbouncer redis minio minio-init migrate bootstrap \
            clamav antivirus backend admin edge
      - name: Дождаться /healthz и проверить состояние сервисов
        run: |
          compose() {
            docker compose --env-file "$COMPOSE_ENV" \
              -f docker-compose.prod.yml \
              -f infrastructure/ci/docker-compose.ci.yml "$@"
          }

          # {{.Service}} {{.State}} {{.ExitCode}} — штатные поля шаблона
          # docker compose ps: "running 0" или "exited 0".
          states() { compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}'; }

          ready=0
          for attempt in $(seq 1 360); do
            if curl -fsS --max-time 5 http://primary.local:8080/healthz | grep -q '"status":"ok"'; then
              echo "healthz ответил на попытке $attempt"
              ready=1
              break
            fi

            # Не ждём полчаса, если сервис уже упал: показываем причину сразу.
            # Одноразовые сервисы с кодом 0 под условие не попадают, а с
            # ненулевым — это реальная ошибка (migrate/bootstrap/minio-init).
            current=$(states || true)
            broken=$(printf '%s\n' "$current" | awk '($2 == "exited" && $3 != 0) || $2 == "dead" {print $1}')
            if [[ -n $broken ]]; then
              echo "Сервисы завершились с ошибкой: $broken"
              compose ps -a
              # shellcheck disable=SC2086 -- имена сервисов разделены пробелами
              compose logs --no-color --tail=200 $broken
              exit 1
            fi
            sleep 5
          done

          if [[ $ready != 1 ]]; then
            echo 'healthz не ответил за 30 минут'
            compose ps -a
            compose logs --no-color --tail=200
            exit 1
          fi

          states=$(states)
          printf '%s\n' "$states"
          for service in postgres pgbouncer redis minio antivirus backend admin edge; do
            if ! grep -qE "^$service running " <<<"$states"; then
              echo "Сервис $service не запущен"
              exit 1
            fi
          done
          for service in migrate bootstrap minio-init; do
            if ! grep -qE "^$service exited 0$" <<<"$states"; then
              echo "Сервис $service завершился с ошибкой (ожидался код 0)"
              exit 1
            fi
          done
      - name: Smoke через edge
        run: infrastructure/scripts/smoke.sh http://primary.local:8080 --origin https://primary.local
      - name: Резервная копия и восстановление на реальном PostgreSQL
        run: |
          compose() {
            docker compose --env-file "$COMPOSE_ENV" \
              -f docker-compose.prod.yml \
              -f infrastructure/ci/docker-compose.ci.yml "$@"
          }

          # Планировщик копий и restore вызывают pg_dump/pg_restore внутри
          # backend (в образе postgresql16-client). DATABASE_URL смотрит на
          # PgBouncer, а pg_dump в transaction mode не работает, поэтому и дамп,
          # и восстановление идут по DIRECT_DATABASE_URL — прямому подключению.
          compose exec -T backend sh -eu -c '
            echo "pg_dump: $(pg_dump --version)"
            echo "pg_restore: $(pg_restore --version)"
            test -n "${DIRECT_DATABASE_URL:-}"
            src=$(printf '%s' "$DIRECT_DATABASE_URL" | sed 's/[?].*$//')
            pg_dump --format=custom --no-owner --no-privileges --file=/tmp/ci-backup.dump "$src"
            pg_restore --list /tmp/ci-backup.dump >/tmp/ci-backup.list
            objects=$(wc -l </tmp/ci-backup.list | tr -d " ")
            echo "оглавление дампа: $objects строк"
            test "$objects" -gt 10
            psql "$src" -v ON_ERROR_STOP=1 -qAt -c "DROP DATABASE IF EXISTS itadis_restore_check"
            psql "$src" -v ON_ERROR_STOP=1 -qAt -c "CREATE DATABASE itadis_restore_check"
            target="${src%/*}/itadis_restore_check"
            pg_restore --clean --if-exists --single-transaction --exit-on-error \
              --no-owner --no-privileges --dbname="$target" /tmp/ci-backup.dump
            before=$(psql "$src" -v ON_ERROR_STOP=1 -qAt -c "SELECT count(*) FROM \"User\"")
            after=$(psql "$target" -v ON_ERROR_STOP=1 -qAt -c "SELECT count(*) FROM \"User\"")
            echo "пользователей: источник=$before, восстановленная копия=$after"
            test "$before" = "$after"
            test "$after" -gt 0
            psql "$src" -v ON_ERROR_STOP=1 -qAt -c "DROP DATABASE itadis_restore_check"
            echo "Резервная копия и восстановление: OK"
          '
      - name: Значения секретов из env-файла не попадают в логи стека
        run: |
          compose() {
            docker compose --env-file "$COMPOSE_ENV" \
              -f docker-compose.prod.yml \
              -f infrastructure/ci/docker-compose.ci.yml "$@"
          }

          # Логи собираем из stdout и stderr в один файл и ищем в нём буквальные
          # значения секретов из того же env-файла, с которым поднят стек:
          # паттерн «password=» дал бы ложные срабатывания, а так проверяется
          # именно то, что генерировал CI.
          compose logs --no-color backend admin edge bootstrap migrate \
            >/tmp/stack-logs.txt 2>&1

          leaked=0
          while IFS='=' read -r key value; do
            case "$key" in
              POSTGRES_PASSWORD|JWT_ACCESS_SECRET|JWT_REFRESH_SECRET|DATA_ENCRYPTION_KEY|S3_SECRET_KEY|PLATFORM_ADMIN_PASSWORD) ;;
              *) continue ;;
            esac
            [[ -n $value ]] || continue
            if grep -qF -- "$value" /tmp/stack-logs.txt; then
              echo "Значение $key попало в логи стека"
              leaked=1
            fi
          done <"$COMPOSE_ENV"

          if ((leaked)); then
            exit 1
          fi
          echo 'Секретов из env-файла в логах нет'
      - name: В логах приложения нет ERROR/FATAL/Unhandled
        run: |
          compose() {
            docker compose --env-file "$COMPOSE_ENV" \
              -f docker-compose.prod.yml \
              -f infrastructure/ci/docker-compose.ci.yml "$@"
          }
          if compose logs --no-color backend admin edge bootstrap migrate | grep -E 'Unhandled|FATAL|ERROR'; then
            echo 'В логах стека есть ошибки'
            exit 1
          fi
          echo 'Ошибок в логах нет'
      - name: Логи стека при ошибке
        if: failure()
        run: |
          docker compose --env-file "$COMPOSE_ENV" \
            -f docker-compose.prod.yml \
            -f infrastructure/ci/docker-compose.ci.yml logs --no-color --tail=300
      - name: Остановить стек
        if: always()
        run: |
          docker compose --env-file "$COMPOSE_ENV" \
            -f docker-compose.prod.yml \
            -f infrastructure/ci/docker-compose.ci.yml down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itadis
          POSTGRES_PASSWORD: itadis
          POSTGRES_DB: itadis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itadis -d itadis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itadis:itadis@127.0.0.1:5432/itadis?schema=public
      CONTROL_DATABASE_URL: postgresql://itadis:itadis@127.0.0.1:5432/itadis?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production-1234
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production-5678
      NODE_ENV: test
      E2E_BASE_URL: http://primary.local:4000
      E2E_ADMIN_EMAIL: admin@itadis.kg
      E2E_ADMIN_PASSWORD: ITadis2026
      E2E_BRANCH_B_URL: http://branch-b.itadis.test:4000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - name: Создать филиал B для проверки изоляции
        run: |
          npx prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          INSERT INTO "Branch" (
            "id", "name", "slug", "domain", "databaseName", "storagePrefix", "status",
            "isPrimary", "adminEmail", "updatedAt"
          ) VALUES (
            '00000000-0000-0000-0000-0000000000b2',
            'E2E филиал B',
            'e2e-branch-b',
            'branch-b.itadis.test',
            'itadis_branch_e2e_b',
            'e2e-branch-b',
            'ACTIVE',
            false,
            'admin@itadis.kg',
            CURRENT_TIMESTAMP
          ) ON CONFLICT ("domain") DO NOTHING;
          SQL
      - name: Создать БД филиала B и применить миграции
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client'

          const databaseName = 'itadis_branch_e2e_b'
          const url = new URL(process.env.DATABASE_URL)
          const adminUrl = new URL(url)
          adminUrl.pathname = '/postgres'
          adminUrl.searchParams.delete('schema')

          const admin = new PrismaClient({ datasourceUrl: adminUrl.toString() })
          try {
            const exists = await admin.$queryRawUnsafe(
              'SELECT 1 FROM pg_database WHERE datname = $1',
              databaseName,
            )
            if (exists.length === 0) {
              await admin.$executeRawUnsafe(`CREATE DATABASE "${databaseName}"`)
            }
          } finally {
            await admin.$disconnect()
          }
          NODE

          BRANCH_B_DATABASE_URL="${DATABASE_URL%/*}/itadis_branch_e2e_b"
          DATABASE_URL="$BRANCH_B_DATABASE_URL" npx prisma migrate deploy
      - name: Направить домены филиалов на локальный API
        run: echo '127.0.0.1 primary.local branch-b.itadis.test' | sudo tee -a /etc/hosts
      - name: Собрать и запустить API
        run: |
          npm run build
          nohup node dist/src/main.js > /tmp/itadis-e2e-api.log 2>&1 &
          echo $! > /tmp/itadis-e2e-api.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/healthz | grep -q '"status":"ok"'; then
              echo "API готов к e2e"
              exit 0
            fi
            sleep 2
          done
          echo "API не поднялся за 120 секунд"
          cat /tmp/itadis-e2e-api.log
          exit 1
      - name: E2E (9 сценариев, без пропусков)
        env:
          E2E_BASE_URL: http://primary.local:4000
          E2E_ADMIN_EMAIL: admin@itadis.kg
          E2E_ADMIN_PASSWORD: ITadis2026
          E2E_BRANCH_B_URL: http://branch-b.itadis.test:4000
        run: |
          rm -f /tmp/itadis-e2e.json
          set +e
          npm run test:e2e -- --reporter=json --outputFile=/tmp/itadis-e2e.json
          status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs')
          const reportPath = '/tmp/itadis-e2e.json'
          if (!fs.existsSync(reportPath)) {
            console.error(`E2E: отчёт не создан (${reportPath})`)
            process.exit(1)
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const total = report.numTotalTests ?? 0
          const passed = report.numPassedTests ?? 0
          const failed = report.numFailedTests ?? 0
          const skipped = report.numPendingTests ?? 0
          console.log(`E2E: passed=${passed}, failed=${failed}, skipped=${skipped}, total=${total}`)

          if (skipped !== 0) {
            console.error('E2E: есть пропущенные сценарии. Проверьте E2E_BASE_URL и обязательные E2E_* переменные.')
            process.exit(1)
          }
          if (failed !== 0 || passed < 9) {
            console.error('E2E: ожидалось не менее 9 успешных сценариев.')
            process.exit(1)
          }
          NODE

          exit "$status"
      - name: Журнал API при ошибке
        if: failure()
        run: cat /tmp/itadis-e2e-api.log
      - name: Остановить API
        if: always()
        run: |
          if [ -f /tmp/itadis-e2e-api.pid ]; then
            kill "$(cat /tmp/itadis-e2e-api.pid)" 2>/dev/null || true
          fi

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Линтер — единственный гейт, который ловит `any` и «висящие» промисы без
  # запуска тестов. oxlint стоит в корне, поэтому нужен корневой npm ci.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Гейт deploy-пути: синтаксис shell-скриптов, валидность production-compose
  # и Caddyfile проверяются до того, как кто-то окажется на сервере.
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Приватные ключи не попадают в репозиторий
        run: |
          # .deploy/ игнорируется, но проверка в CI не даёт вернуть ключ в обход правила.
          git check-ignore -q .deploy/vps_ed25519 || {
            echo '.deploy/ не игнорируется git: добавьте правило в .gitignore'
            exit 1
          }
          if git grep -nIE -- '-----BEGIN (OPENSSH|RSA|EC|DSA|PGP) PRIVATE KEY-----' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'В отслеживаемых файлах найден приватный ключ: удалите его и отзовите (ротация).'
            exit 1
          fi
          echo 'Приватных ключей в отслеживаемых файлах нет'
      - name: shellcheck -x для infrastructure/*.sh
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          shellcheck_bin="$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck"
          mapfile -t scripts < <(find infrastructure -name '*.sh' -type f | sort)
          if ((${#scripts[@]} == 0)); then
            echo 'В infrastructure нет shell-скриптов'
            exit 1
          fi
          printf 'Проверяю: %s\n' "${scripts[*]}"
          "$shellcheck_bin" --version
          "$shellcheck_bin" -x "${scripts[@]}"
      - name: bats для preflight deploy.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          bats --version
          bats infrastructure/tests/deploy.bats
      - name: docker compose config -q для production
        run: |
          # Одноразовый env: значения фиктивные, но нужной формы.
          env_file="$RUNNER_TEMP/production.env"
          printf '%s\n' \
            'POSTGRES_USER=itadis' \
            'POSTGRES_DB=itadis' \
            'POSTGRES_PASSWORD=ci-postgres-password-0123456789abcdef' \
            'PUBLIC_HOSTNAME=203-0-113-10.sslip.io' \
            'ACME_EMAIL=ci@example.com' \
            'APP_ORIGIN=https://203-0-113-10.sslip.io' \
            'ADMIN_WEB_ORIGIN=https://203-0-113-10.sslip.io' \
            'API_PUBLIC_URL=https://203-0-113-10.sslip.io' \
            'PRIMARY_DOMAIN=203-0-113-10.sslip.io' \
            'PLATFORM_DOMAIN=203-0-113-10.sslip.io' \
            'JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef0123' \
            'JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef0123' \
            'DATA_ENCRYPTION_KEY=ci-encryption-key-0123456789abcdef0123' \
            'S3_ACCESS_KEY=ci-s3-access-key' \
            'S3_SECRET_KEY=ci-s3-secret-key-0123456789abcdef' \
            'PLATFORM_ADMIN_EMAIL=admin@example.com' \
            'PLATFORM_ADMIN_PASSWORD=ci-platform-admin-password' >"$env_file"
          docker compose --env-file "$env_file" -f docker-compose.prod.yml config -q
          echo 'compose config валиден'
      - name: caddy validate для Caddyfile
        run: |
          # Caddyfile читает эти значения из окружения; они же нужны для validate.
          export PUBLIC_HOSTNAME=203-0-113-10.sslip.io
          export ACME_EMAIL=ci@example.com
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/caddy.tar.gz" \
            https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" validate --config infrastructure/caddy/Caddyfile --adapter caddyfile
