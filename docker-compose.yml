services:
  postgres:
    image: postgres:16-alpine
    container_name: itadis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itadis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itadis}
      POSTGRES_DB: ${POSTGRES_DB:-itadis}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U itadis -d itadis']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: itadis-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./apps/api
    container_name: itadis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Локальный compose не должен требовать production-секреты и сканер.
    # Ключи интеграций можно держать в apps/api/.env — он подхватится целиком.
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-itadis}:${POSTGRES_PASSWORD:-itadis}@postgres:5432/${POSTGRES_DB:-itadis}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-please}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8081}
      # Локальный compose: основной филиал обслуживает localhost.
      ALLOW_PRIMARY_FALLBACK: ${ALLOW_PRIMARY_FALLBACK:-true}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-}
      # Консоль главного администратора: задайте домен и пароль в .env.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform@itadis.kg}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /data/backups
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-false}
      LIVEDIGITAL_API_URL: ${LIVEDIGITAL_API_URL:-https://moodhood-api.livedigital.space/v1}
      LIVEDIGITAL_API_TOKEN: ${LIVEDIGITAL_API_TOKEN:-}
      LIVEDIGITAL_SPACE_ID: ${LIVEDIGITAL_SPACE_ID:-}
      LIVEDIGITAL_WEBHOOK_SECRET: ${LIVEDIGITAL_WEBHOOK_SECRET:-}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    volumes:
      - storage_data:/data/storage
      - backup_data:/data/backups
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  storage_data:
  backup_data:
